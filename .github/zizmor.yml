# validator-release.yml is generated by cargo-dist. Its plan job produces the
# build matrix, including command fragments and platform container images, for
# build-local-artifacts. That job has only contents: read and intentionally
# executes the generated plan; releases are published by the separate host job.
rules:
  template-injection:
    ignore:
      - validator-release.yml
  unpinned-images:
    ignore:
      - validator-release.yml
